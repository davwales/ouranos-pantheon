info:
  name: Create
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/hermes/conversations"
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "personaId": "{{PERSONA_ID}}",
        "modelConfigId": "{{MODEL_ID}}",
        "traitIds": [
          "{{TRAIT_ID}}"
        ],
        "loraIds": [
          "{{LORA_ID}}"
        ],
        "name": "Bruno chat",
        "isPublic": true,
        "folderId": null,
        "reasoningEffort": "Low",
        "messages": [
          {
            "role": "User",
            "content": "Hello from Bruno"
          },
          {
            "role": "Assistant",
            "content": "Hello! How can I help?",
            "parts": [
              {
                "$type": "reasoning",
                "content": "The user greeted me."
              },
              {
                "$type": "text",
                "content": "Hello! How can I help?"
              },
              {
                "$type": "toolCall",
                "callId": "call-1",
                "name": "generate_image",
                "arguments": "{\"prompt\":\"A red fox in the snow\"}",
                "status": "Completed",
                "output": "The image is now shown to the user.",
                "isTruncated": false,
                "durationMs": 42000
              },
              {
                "$type": "image",
                "imageId": "{{IMAGE_ID}}",
                "width": 1024,
                "height": 1024,
                "altText": "A red fox in the snow"
              }
            ]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
