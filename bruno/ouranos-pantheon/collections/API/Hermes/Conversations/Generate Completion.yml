info:
  name: Generate Completion
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/api/hermes/conversations/completions/stream"
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "conversationId": null,
        "conversation": {
          "model": {
            "modelIdentifier": "{{MODEL_IDENTIFIER}}",
            "systemPrompt": "You are a helpful assistant.",
            "temperature": 0.7,
            "maxTokens": 4096,
            "isToolCallingEnabled": false
          },
          "persona": {
            "name": "Assistant",
            "description": "A helpful assistant."
          },
          "messages": [
            {
              "role": "User",
              "content": "What time is it in Tokyo?"
            },
            {
              "role": "Assistant",
              "content": "It is 9:00 in Tokyo.",
              "toolCalls": [
                {
                  "callId": "call-1",
                  "name": "get_time",
                  "arguments": "{\"timeZone\":\"Asia/Tokyo\"}",
                  "output": "09:00"
                }
              ]
            },
            {
              "role": "User",
              "content": "Tell me a programming joke"
            }
          ],
          "traits": [],
          "reasoningEffort": "Medium"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
