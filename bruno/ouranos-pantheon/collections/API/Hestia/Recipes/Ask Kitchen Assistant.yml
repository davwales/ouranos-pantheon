info:
  name: Ask Kitchen Assistant
  type: http
  seq: 9

http:
  method: POST
  url: "{{BASE_URL}}/api/hestia/recipes/assistant/completions/stream"
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "messages": [
          {
            "role": "User",
            "content": "Can I make this recipe dairy-free?"
          },
          {
            "role": "Assistant",
            "content": "Yes: swap the butter for olive oil. Review the proposed change.",
            "actions": [
              {
                "name": "update_ingredient",
                "description": "Replace 50 g butter with 3 tbsp olive oil",
                "status": "Rejected"
              }
            ]
          },
          {
            "role": "User",
            "content": "What else could replace the butter?"
          }
        ],
        "context": {
          "recipeId": "{{HESTIA_RECIPE_ID}}"
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
