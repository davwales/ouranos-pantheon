info:
  name: Symbol Signal History
  type: http
  seq: 3

http:
  method: GET
  url: "{{BASE_URL}}/api/plutus/symbols/{{SYMBOL_ID}}/signal-history?intent=Buy,Sell&from=2026-01-01T00:00:00Z&to=2026-12-31T00:00:00Z"
  params:
    - name: intent
      value: "Buy,Sell"
      type: query
    - name: from
      value: "2026-01-01T00:00:00Z"
      type: query
    - name: to
      value: "2026-12-31T00:00:00Z"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
