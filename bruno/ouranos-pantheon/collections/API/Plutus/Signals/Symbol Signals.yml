info:
  name: Symbol Signals
  type: http
  seq: 2

http:
  method: GET
  url: "{{BASE_URL}}/api/plutus/symbols/{{SYMBOL_ID}}/signals?intent=Buy,Sell"
  params:
    - name: intent
      value: "Buy,Sell"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
