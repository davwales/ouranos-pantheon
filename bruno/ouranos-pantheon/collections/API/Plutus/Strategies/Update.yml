info:
  name: Update
  type: http
  seq: 4

http:
  method: PUT
  url: "{{BASE_URL}}/api/plutus/strategies/{{STRATEGY_ID}}"
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "name": "Bruno Momentum",
        "description": "RSI + momentum blend updated from Bruno",
        "configuration": {
          "maxPositions": 5,
          "maxPositionPercent": 10,
          "holdPeriodDays": 30
        },
        "inputWeights": [
          {
            "kind": "SignalRsi",
            "weight": 0.5
          },
          {
            "kind": "SignalTrendMomentum",
            "weight": 0.5
          }
        ],
        "thresholds": {
          "buyThreshold": 0.6,
          "sellThreshold": 0.4
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
