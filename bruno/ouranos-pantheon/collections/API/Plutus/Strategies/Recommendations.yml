info:
  name: Recommendations
  type: http
  seq: 9

http:
  method: GET
  url: "{{BASE_URL}}/api/plutus/strategies/{{STRATEGY_ID}}/recommendations?marketId={{MARKET_ID}}&budget=10000"
  params:
    - name: marketId
      value: "{{MARKET_ID}}"
      type: query
    - name: budget
      value: "10000"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
