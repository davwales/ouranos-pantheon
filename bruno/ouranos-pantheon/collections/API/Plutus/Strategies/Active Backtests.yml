info:
  name: Active Backtests
  type: http
  seq: 15

http:
  method: GET
  url: "{{BASE_URL}}/api/plutus/backtests/active?marketId={{MARKET_ID}}&skip=0&take=10"
  params:
    - name: marketId
      value: "{{MARKET_ID}}"
      type: query
    - name: skip
      value: "0"
      type: query
    - name: take
      value: "10"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
