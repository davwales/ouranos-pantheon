info:
  name: Create
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/plutus/strategies"
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "marketId": "{{MARKET_ID}}",
        "name": "Bruno Momentum",
        "description": "RSI + momentum blend created from Bruno",
        "configuration": {
          "maxPositions": 5,
          "maxPositionPercent": 10,
          "holdPeriodDays": 30
        },
        "inputWeights": [
          {
            "kind": "SignalRsi",
            "weight": 0.5
          },
          {
            "kind": "SignalTrendMomentum",
            "weight": 0.5
          }
        ],
        "thresholds": {
          "buyThreshold": 0.6,
          "sellThreshold": 0.4
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
