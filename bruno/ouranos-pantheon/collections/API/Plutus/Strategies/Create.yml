info:
  name: Create
  type: http
  seq: 3

http:
  method: POST
  url: "{{BASE_URL}}/api/plutus/strategies"
  params:
    - name: ""
      value: ""
      type: query
  body:
    type: json
    data: |-
      {
        "marketId": "{{MARKET_ID}}",
        "name": "Bruno Momentum",
        "description": "RSI + momentum blend created from Bruno",
        "configuration": {
          "mode": "Swing",
          "inputWeights": [
            {
              "kind": "SignalRsi",
              "weight": 0.5
            },
            {
              "kind": "SignalTrendMomentum",
              "weight": 0.5
            }
          ],
          "buyThreshold": 0.6,
          "sellThreshold": 0.4,
          "maxPositions": 5,
          "maxPositionPercent": 0.1,
          "holdPeriodDays": 30
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
