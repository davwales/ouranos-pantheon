info:
  name: Symbol Trades
  type: http
  seq: 6

http:
  method: GET
  url: "{{BASE_URL}}/api/plutus/symbols/{{SYMBOL_ID}}/trades?timeFrame=OneHour&numBuckets=100"
  params:
    - name: timeFrame
      value: "OneHour"
      type: query
    - name: numBuckets
      value: "100"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
