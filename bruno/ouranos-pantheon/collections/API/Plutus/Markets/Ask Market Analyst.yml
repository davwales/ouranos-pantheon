info:
  name: Ask Market Analyst
  type: http
  seq: 6

http:
  method: POST
  url: "{{BASE_URL}}/api/plutus/markets/assistant/completions/stream"
  body:
    type: json
    data: |-
      {
        "messages": [
          {
            "role": "User",
            "content": "Show me the most traded symbols."
          },
          {
            "role": "Assistant",
            "content": "I proposed a view sorted by volume; apply it to see them.",
            "actions": [
              {
                "name": "set_explorer_view",
                "description": "Sort by total volume, highest first",
                "status": "Applied"
              }
            ]
          },
          {
            "role": "User",
            "content": "Which of these is the best opportunity?"
          }
        ],
        "context": {
          "marketId": "{{MARKET_ID}}",
          "timeFrame": "OneDay",
          "view": {
            "filter": ["TotalVolume:gte:1000"],
            "sortField": "TotalGain",
            "sortDirection": "desc",
            "skip": 0,
            "take": 10
          }
        }
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
