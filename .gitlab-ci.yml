stages:
  - build_gateway
  - build_interface
  - push_images

variables:
  DOCKER_IMAGE_GATEWAY: "$CI_REGISTRY_IMAGE/pantheon-gateway"
  DOCKER_IMAGE_INTERFACE: "$CI_REGISTRY_IMAGE/pantheon-interface"

  DOCKER_TAR_GATEWAY: "pantheon-gateway.tar"
  DOCKER_TAR_INTERFACE: "pantheon-interface.tar"

build_gateway:
  stage: build_gateway
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -f ./src/gateway/Dockerfile -t "$DOCKER_IMAGE_GATEWAY" .
    - docker save "$DOCKER_IMAGE_GATEWAY" -o "$DOCKER_TAR_GATEWAY"
  artifacts:
    paths:
      - "$DOCKER_TAR_GATEWAY"
  only:
    - main

build_interface:
  stage: build_interface
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker build -t "$DOCKER_IMAGE_INTERFACE" ./src/interface
    - docker save "$DOCKER_IMAGE_INTERFACE" -o "$DOCKER_TAR_INTERFACE"
  artifacts:
    paths:
      - "$DOCKER_TAR_INTERFACE"
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules
  only:
    - main

push_images:
  stage: push_images
  image: docker:latest
  services:
    - docker:dind
  dependencies:
    - build_gateway
    - build_interface
  before_script: 
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker load -i "$DOCKER_TAR_GATEWAY"
    - docker push "$DOCKER_IMAGE_GATEWAY"
    - docker load -i "$DOCKER_TAR_INTERFACE"
    - docker push "$DOCKER_IMAGE_INTERFACE"
  only:
    - main
