name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_INSTALL_DIR: "./.dotnet"
  REGISTRY: codeberg.org
  REGISTRY_PREFIX: codeberg.org/${{ github.repository_owner }}/pantheon

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore --verbosity quiet
      - run: dotnet format --verify-no-changes
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/interface/package-lock.json
      - run: npm ci
        working-directory: src/interface
      - run: npm run lint
        working-directory: src/interface

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore --verbosity quiet
      - run: dotnet build Ouranos.Pantheon.sln --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/interface/package-lock.json
      - run: npm ci
        working-directory: src/interface
      - run: npm run build
        working-directory: src/interface

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore --verbosity quiet
      - run: dotnet test --logger "console;verbosity=detailed"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gateway
            dockerfile: src/apps/gateway/Dockerfile
          - name: interface
            dockerfile: src/interface/Dockerfile
          - name: plutus-data-loader-ffxiv
            dockerfile: src/plutus/data-loaders/ffxiv/Dockerfile
          - name: plutus-data-loader-osrs
            dockerfile: src/plutus/data-loaders/osrs/Dockerfile
          - name: plutus-data-loader-stocks
            dockerfile: src/plutus/data-loaders/stocks/Dockerfile
          - name: plutus-data-loader-consumer
            dockerfile: src/plutus/data-loaders/consumer/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}-${{ matrix.name }}
          cache-from: type=registry,ref=${{ env.REGISTRY_PREFIX }}-${{ matrix.name }}:cache
          cache-to: type=registry,ref=${{ env.REGISTRY_PREFIX }}-${{ matrix.name }}:cache,mode=max
