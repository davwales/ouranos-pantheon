name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  DOTNET_INSTALL_DIR: "./.dotnet"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore --verbosity quiet
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet format style --verify-no-changes --no-restore
      - run: dotnet format analyzers --verify-no-changes --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/apps/interface/package-lock.json
      - run: npm ci
        working-directory: src/apps/interface
      - run: npm run lint
        working-directory: src/apps/interface

  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore --verbosity quiet
      - run: dotnet build Ouranos.Pantheon.sln --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/apps/interface/package-lock.json
      - run: npm ci
        working-directory: src/apps/interface
      - run: npm run build
        working-directory: src/apps/interface

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore --verbosity quiet
      - run: dotnet tool restore
      - run: dotnet test --collect:"XPlat Code Coverage"
      - run: dotnet tool run reportgenerator -reports:"**/TestResults/**/coverage.cobertura.xml" -targetdir:coverage-merged -reporttypes:Cobertura
      - name: code coverage
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "coverage-merged/Cobertura.xml"
          fail_below_min: true
          thresholds: "85 100"
          output: "console"

  publish:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: gateway
            dockerfile: src/apps/gateway/Dockerfile
          - name: interface
            dockerfile: src/apps/interface/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase repository
        run: echo "IMAGE_BASE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_BASE }}/${{ matrix.name }}
          cache-from: type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.name }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE_BASE }}/${{ matrix.name }}:cache,mode=max
