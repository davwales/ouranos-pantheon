version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Majors of these track the .NET runtime major; move them with the SDK and base images.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
    groups:
      test:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
          - "NSubstitute"
          - "Shouldly"
          - "Autofixture"
          - "dotnet-reportgenerator-globaltool"
      wolverine:
        patterns:
          - "WolverineFx*"
          - "Marten"
      tickerq:
        patterns:
          - "TickerQ*"
      dotnet-platform:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Npgsql*"
          - "EFCore.NamingConventions"
          - "dotnet-ef"
      opentelemetry:
        patterns:
          - "OpenTelemetry*"
      serilog:
        patterns:
          - "Serilog*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /src/apps/interface
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      next-react:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      radix:
        patterns:
          - "@radix-ui/*"
          - "radix-ui"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      test:
        patterns:
          - "vitest"
          - "@vitejs/*"
          - "@testing-library/*"
          - "jsdom"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /src/apps/gateway
      - /src/apps/interface
    schedule:
      interval: monthly
    # Node majors alternate between LTS and short-lived releases; move to the next LTS by hand.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
